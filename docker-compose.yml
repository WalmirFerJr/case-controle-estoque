services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock # apenas desenvolvimento local
      POSTGRES_DB: stock
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      STOCK_DATABASE_URL: postgresql+psycopg://stock:stock@db:5432/stock
      STOCK_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
