[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stock-control"
version = "1.0.0"
description = "Controle de estoque com reservas e bloqueios — case prático de Engenharia de Software"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stock"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "N",             # pep8-naming
    "C90",           # complexidade ciclomática
    "RUF",           # regras do próprio ruff
    "PT",            # boas práticas de pytest
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# FastAPI usa chamadas em valores default (Depends/Query) por design.
"src/stock/presentation/**" = ["B008"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["stock"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: testes que sobem um PostgreSQL real (Docker/testcontainers)",
    "concurrency: testes de disputa concorrente contra PostgreSQL real",
]
filterwarnings = [
    # Aviso do Starlette sobre o cliente HTTP do TestClient; não afeta a aplicação.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["stock"]
branch = true
omit = ["src/stock/infrastructure/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- import-linter
# Garante automaticamente a regra de dependência da Clean Architecture.
[tool.importlinter]
root_package = "stock"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas: entrada HTTP -> aplicação -> domínio"
type = "layers"
layers = ["stock.presentation", "stock.application", "stock.domain"]

[[tool.importlinter.contracts]]
name = "Camadas: persistência -> aplicação -> domínio"
type = "layers"
layers = ["stock.infrastructure", "stock.application", "stock.domain"]

[[tool.importlinter.contracts]]
name = "HTTP e persistência são adaptadores independentes"
type = "independence"
modules = ["stock.presentation", "stock.infrastructure"]

[[tool.importlinter.contracts]]
name = "Domínio e aplicação não conhecem frameworks"
type = "forbidden"
source_modules = ["stock.domain", "stock.application"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "pydantic", "psycopg", "alembic"]
