# Hooks locais (usam as ferramentas do .venv): pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: arquitetura (import-linter)
        entry: env PYTHONPATH=src .venv/bin/lint-imports
        language: system
        pass_filenames: false
        types: [python]
